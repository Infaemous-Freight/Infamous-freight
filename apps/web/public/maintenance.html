<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#080204" />
    <title>Infamous Freight Maintenance</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #080204;
        color: #f5e8e8;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top left, rgba(255, 59, 48, 0.22), transparent 34%), #080204;
      }
      main {
        box-sizing: border-box;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
      }
      section {
        width: min(100%, 680px);
        border: 1px solid rgba(245, 232, 232, 0.12);
        border-radius: 12px;
        background: rgba(24, 8, 10, 0.92);
        padding: clamp(28px, 6vw, 56px);
      }
      p:first-child {
        margin: 0 0 14px;
        color: #ff6b5f;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 4.5rem);
        line-height: 0.95;
      }
      p {
        color: #caa0a0;
        font-size: 1rem;
        line-height: 1.7;
      }
      a {
        color: #ff6b5f;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <p>Infamous Freight</p>
        <h1>Maintenance is in progress.</h1>
        <p>
          Public freight tools are temporarily unavailable while a deployment or service check completes.
          Urgent quote, tracking, or carrier support requests can be sent to
          <a href="mailto:dispatch@infamousfreight.com">dispatch@infamousfreight.com</a>.
        </p>
      </section>
    </main>
  </body>
</html>

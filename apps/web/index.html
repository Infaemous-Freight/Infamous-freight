    <link rel="dns-prefetch" href="https://infamous-freight.fly.dev" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }
      body {
        background: #080204;
        color: #F5E8E8;
        margin: 0;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .skip-link {
        position: absolute;
        left: -9999px;
        top: -9999px;
      }
      .skip-link:focus {
        left: 1rem;
        top: 1rem;
        z-index: 100;
        padding: 0.5rem 0.75rem;
        background: #FF1A1A;
        color: #F5E8E8;
        border-radius: 6px;
        text-decoration: none;
      }
      .app-shell-fallback {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: radial-gradient(circle at top, rgba(255, 26, 26, 0.22), transparent 35%), linear-gradient(180deg, #160608 0%, #080204 100%);
        color: #F5E8E8;
        text-align: center;
      }
      .app-shell-fallback__card { width: min(100%, 920px); text-align: left; }
      .shell-line { display: block; height: 18px; border-radius: 999px; background: rgba(245, 232, 232, 0.14); animation: shell-pulse 1.4s ease-in-out infinite; }
      .shell-line--brand { width: 180px; background: rgba(255, 59, 48, 0.32); margin-bottom: 28px; }
      .shell-line--hero { width: min(100%, 720px); height: clamp(52px, 8vw, 84px); border-radius: 10px; margin-bottom: 14px; }
      .shell-line--hero-short { width: min(78%, 540px); height: clamp(52px, 8vw, 84px); border-radius: 10px; margin-bottom: 24px; }
      .shell-line--copy { width: min(70%, 520px); height: 14px; background: rgba(184, 137, 137, 0.26); margin-bottom: 10px; }
      .shell-line--copy-short { width: min(52%, 380px); height: 14px; background: rgba(184, 137, 137, 0.2); }
      @keyframes shell-pulse { 0%, 100% { opacity: 0.54; } 50% { opacity: 1; } }
      .noscript-nav { margin-top: 2rem; display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
      .noscript-nav a { color: #FF3B30; text-decoration: underline; font-size: 0.95rem; }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div id="root">
      <main class="app-shell-fallback" aria-live="polite">
        <section class="app-shell-fallback__card">
          <span class="shell-line shell-line--brand" aria-hidden="true"></span>
          <span class="shell-line shell-line--hero" aria-hidden="true"></span>
          <span class="shell-line shell-line--hero-short" aria-hidden="true"></span>
          <span class="shell-line shell-line--copy" aria-hidden="true"></span>
          <span class="shell-line shell-line--copy-short" aria-hidden="true"></span>
          <span class="skip-link">Infamous Freight route content is preparing.</span>
          <noscript>
            <nav class="noscript-nav" aria-label="Site navigation">
              <a href="/request-quote">Request a Quote</a>
              <a href="/tracking">Track Shipment</a>
              <a href="/services">Services</a>
              <a href="/pricing">Pricing</a>
              <a href="/drivers">Apply to Drive</a>
              <a href="/load-board">Load Board</a>
              <a href="/resources">Resources</a>
              <a href="/contact">Contact</a>
              <a href="/about">About</a>
            </nav>
          </noscript>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

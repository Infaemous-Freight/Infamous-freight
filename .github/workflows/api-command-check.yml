name: API Command Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/api-command-check.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'apps/api/**'
      - 'scripts/ensure-api-workspace.js'

permissions:
  contents: read

concurrency:
  group: api-command-check-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/infamous_test'
  REDIS_URL: 'redis://localhost:6379'

jobs:
  api-command-check:
    name: Run requested API commands
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm run build:api

      - name: Test API
        run: pnpm run test:api

      - name: Write summary
        if: always()
        run: |
          echo "API Command Check for ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commands: install, build:api, test:api" >> "$GITHUB_STEP_SUMMARY"

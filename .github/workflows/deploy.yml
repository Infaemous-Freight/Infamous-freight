name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.0.0'

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Configure pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma versions
        run: pnpm run check:prisma-versions

      - name: Check frontend environment safety
        run: pnpm run env:check:frontend

      - name: Check Supabase client environment
        run: pnpm run env:check:supabase-client

      - name: Check Fly + Docker deployment invariants
        run: bash scripts/check-fly-docker-config.sh

      - name: Codex environment check
        run: pnpm run codex:env-check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Validate Prisma schema
        run: pnpm run prisma:validate

      - name: Test
        run: pnpm run test

      - name: Build workspace
        run: pnpm run build
        env:
          SENTRY_DISABLE_UPLOAD: 'true'

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  deploy-netlify:
    name: Deploy Netlify production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://www.infamousfreight.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: apps/web/dist
          production-deploy: true
          deploy-message: Production deploy from GitHub Actions ${{ github.sha }}
          enable-pull-request-comment: false
          enable-commit-comment: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  smoke-test:
    name: Production smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy-netlify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check production endpoints
        run: |
          set -euo pipefail

          curl --fail --show-error --location --head https://www.infamousfreight.com

          web_live_status="$(curl --silent --output /dev/null --write-out '%{http_code}' https://www.infamousfreight.com/api/health/live)"
          if [ "$web_live_status" != "200" ]; then
            echo "Unexpected web liveness response: $web_live_status" >&2
            exit 1
          fi

          web_health_status="$(curl --silent --output /dev/null --write-out '%{http_code}' https://www.infamousfreight.com/api/health)"
          if [ "$web_health_status" != "200" ] && [ "$web_health_status" != "503" ]; then
            echo "Unexpected web readiness response: $web_health_status" >&2
            exit 1
          fi

          fly_live_status="$(curl --silent --output /dev/null --write-out '%{http_code}' https://infamous-freight-api.fly.dev/api/health/live)"
          if [ "$fly_live_status" != "200" ]; then
            echo "Unexpected Fly API liveness response: $fly_live_status" >&2
            exit 1
          fi

          for endpoint in \
            https://www.infamousfreight.com/api/metrics \
            https://www.infamousfreight.com/api/health/performance \
            https://www.infamousfreight.com/api/health/database
          do
            endpoint_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$endpoint")"
            if [ "$endpoint_status" = "000" ] || [ "$endpoint_status" -ge 500 ]; then
              echo "warning: diagnostic endpoint $endpoint returned $endpoint_status" >&2
            fi
          done

          redirect_status="$(curl --silent --output /dev/null --write-out '%{http_code}' https://infamousfreight.com)"
          if [ "$redirect_status" != "301" ] && [ "$redirect_status" != "200" ]; then
            echo "Unexpected apex response: $redirect_status" >&2
            exit 1
          fi

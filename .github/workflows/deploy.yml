name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.3.0'
  WEB_PRODUCTION_URL: https://www.infamousfreight.com
  API_PRODUCTION_URL: https://api.infamousfreight.com
  FLY_APP: infamous-freight-api

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Configure pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Verify workspace with diagnostics
        run: bash scripts/ci-verify-workspace.sh

      - name: Upload verify diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-workspace-diagnostics
          path: .ci/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  deploy-netlify:
    name: Deploy Netlify production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    environment:
      name: production
      url: https://www.infamousfreight.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Validate Netlify deployment secrets
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ]; then
            echo "Missing required GitHub Actions secret: NETLIFY_AUTH_TOKEN" >&2
            missing=1
          fi
          if [ -z "${NETLIFY_SITE_ID:-}" ]; then
            echo "Missing required GitHub Actions secret: NETLIFY_SITE_ID" >&2
            missing=1
          fi
          exit "${missing}"

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: apps/web/dist
          production-deploy: true
          deploy-message: Production deploy from GitHub Actions ${{ github.sha }}
          enable-pull-request-comment: false
          enable-commit-comment: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  deploy-fly:
    name: Deploy Fly API production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    environment:
      name: production
      url: https://api.infamousfreight.com/api/health

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Fly deployment secret
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "Missing required GitHub Actions secret: FLY_API_TOKEN" >&2
            exit 1
          fi

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Verify Fly CLI authentication
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl auth whoami >/dev/null
          echo "Fly CLI authentication verified."

      - name: Validate Fly configuration
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl config validate --config fly.toml

      - name: Deploy API to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl deploy \
            --app "${FLY_APP}" \
            --config fly.toml \
            --remote-only \
            --strategy rolling \
            --max-concurrent 1

      - name: Check Fly release health
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl checks list -a "${FLY_APP}"
          curl --fail --show-error --silent --location --retry 5 --retry-delay 10 --retry-connrefused \
            "https://${FLY_APP}.fly.dev/api/health/live" >/dev/null

  smoke-test:
    name: Production smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - deploy-netlify
      - deploy-fly
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Configure pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm -C apps/web exec playwright install --with-deps chromium

      - name: Check production endpoints
        env:
          WEB_PRODUCTION_URL: ${{ env.WEB_PRODUCTION_URL }}
          API_PRODUCTION_URL: ${{ env.API_PRODUCTION_URL }}
          FLY_APP: ${{ env.FLY_APP }}
        run: |
          set -euo pipefail

          check_endpoint() {
            local label="$1"
            local url="$2"
            echo "Checking ${label}: ${url}"
            curl --fail --show-error --silent --location --retry 5 --retry-delay 10 --retry-connrefused \
              --max-time 20 "${url}" >/dev/null
          }

          check_endpoint "web root" "${WEB_PRODUCTION_URL}"
          check_endpoint "proxied API health" "${WEB_PRODUCTION_URL}/api/health"
          check_endpoint "direct API liveness" "${API_PRODUCTION_URL}/api/health/live"
          check_endpoint "direct API health" "${API_PRODUCTION_URL}/api/health"
          check_endpoint "direct API readiness" "${API_PRODUCTION_URL}/api/health/ready"
          check_endpoint "Fly app liveness" "https://${FLY_APP}.fly.dev/api/health/live"

          final_url="$(curl --silent --location --head --retry 5 --retry-delay 10 --retry-connrefused \
            --max-time 20 --output /dev/null --write-out '%{url_effective}' https://infamousfreight.com)"
          if [ "${final_url}" != "${WEB_PRODUCTION_URL}/" ]; then
            echo "Unexpected apex redirect target: ${final_url}" >&2
            exit 1
          fi

      - name: Browser render smoke
        env:
          SITE_URL: ${{ env.WEB_PRODUCTION_URL }}
          SMOKE_TIMEOUT_MS: '30000'
          SMOKE_MIN_TEXT_LENGTH: '120'
        run: pnpm -C apps/web run smoke:render

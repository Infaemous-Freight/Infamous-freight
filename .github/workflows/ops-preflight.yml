name: Ops Preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-preflight.yml'
      - '.github/workflows/deploy-api.yml'
      - '.github/workflows/deploy-fly.yml'
      - 'fly.toml'
      - 'Dockerfile'
      - 'scripts/fly-post-deploy-check.sh'
      - 'scripts/production-smoke-test.sh'
      - 'scripts/production-preflight.sh'

permissions:
  contents: read

concurrency:
  group: ops-preflight-${{ github.ref }}
  cancel-in-progress: true

env:
  FLY_APP_NAME: infamous-freight-api
  FLY_APP_URL: https://infamous-freight-api.fly.dev
  API_URL: https://api.infamousfreight.com
  WEB_URL: https://www.infamousfreight.com

jobs:
  preflight:
    name: Verify production operations readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check required repository files
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          required_files=(
            package.json
            pnpm-lock.yaml
            Dockerfile
            fly.toml
            netlify.toml
            .github/workflows/deploy-api.yml
            .github/workflows/deploy-fly.yml
            .github/workflows/uptime-check.yml
            scripts/fly-post-deploy-check.sh
            scripts/production-smoke-test.sh
            scripts/production-preflight.sh
            docs/PRODUCTION-LAUNCH-RUNBOOK.md
            docs/PRODUCTION-SECRETS-CHECKLIST.md
          )

          {
            echo "## Ops Preflight"
            echo ""
            echo "### Repository files"
            echo "| File | Status |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for file in "${required_files[@]}"; do
            if [[ -f "$file" ]]; then
              echo "| \`$file\` | ✅ present |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Missing required file: $file"
              echo "| \`$file\` | ❌ missing |" >> "$GITHUB_STEP_SUMMARY"
              missing=1
            fi
          done

          exit "$missing"

      - name: Confirm fly.toml app name
        shell: bash
        run: |
          set -euo pipefail
          actual_app="$(awk -F"'" '/^app =/ {print $2}' fly.toml)"
          if [[ -z "$actual_app" ]]; then
            actual_app="$(awk -F'"' '/^app =/ {print $2}' fly.toml)"
          fi
          echo "fly.toml app: ${actual_app}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$actual_app" != "$FLY_APP_NAME" ]]; then
            echo "::error::fly.toml app mismatch. Expected ${FLY_APP_NAME}, got ${actual_app:-empty}."
            exit 1
          fi

      - name: Verify GitHub Actions secret presence
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo ""
            echo "### GitHub Actions secrets"
            echo "| Secret | Status |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -z "${FLY_API_TOKEN:-}" ]]; then
            echo "::error::Missing GitHub Actions secret FLY_API_TOKEN."
            echo "| \`FLY_API_TOKEN\` | ❌ missing |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "| \`FLY_API_TOKEN\` | ✅ present |" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master (2026-04-08)

      - name: Verify Fly app and required secrets
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl auth whoami
          flyctl status --app "$FLY_APP_NAME"

          secrets_output="$(flyctl secrets list --app "$FLY_APP_NAME")"
          printf '%s\n' "$secrets_output"

          {
            echo ""
            echo "### Fly.io"
            echo "| Check | Status |"
            echo "|---|---|"
            echo "| App \`$FLY_APP_NAME\` | ✅ accessible |"
          } >> "$GITHUB_STEP_SUMMARY"

          missing=0
          for secret_name in DATABASE_URL STRIPE_WEBHOOK_SECRET SUPABASE_JWT_SECRET; do
            if printf '%s\n' "$secrets_output" | awk 'NR>1 {print $1}' | grep -qx "$secret_name"; then
              echo "| Fly secret \`$secret_name\` | ✅ present |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Missing Fly secret ${secret_name}."
              echo "| Fly secret \`$secret_name\` | ⚠️ missing |" >> "$GITHUB_STEP_SUMMARY"
              if [[ "$secret_name" == "DATABASE_URL" ]]; then
                missing=1
              fi
            fi
          done

          exit "$missing"

      - name: Check production HTTP endpoints
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          checks=(
            "Frontend|${WEB_URL}|200"
            "Fly live|${FLY_APP_URL}/api/health/live|200"
            "Fly ready|${FLY_APP_URL}/api/health/ready|200"
            "API live|${API_URL}/api/health/live|200"
            "API ready|${API_URL}/api/health/ready|200"
          )

          {
            echo ""
            echo "### Production endpoints"
            echo "| Check | URL | Expected | Actual | Result |"
            echo "|---|---|---:|---:|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for check in "${checks[@]}"; do
            IFS='|' read -r name url expected <<< "$check"
            actual="$(curl --silent --location --retry 2 --retry-delay 2 --retry-connrefused --max-time 10 --output /dev/null --write-out '%{http_code}' "$url" 2>/dev/null || true)"
            actual="${actual:-000}"
            if [[ "$actual" == "$expected" ]]; then
              result="✅ PASS"
            else
              result="❌ FAIL"
              failed=1
              echo "::error::${name} failed: expected ${expected}, got ${actual} (${url})"
            fi
            echo "| ${name} | \`${url}\` | ${expected} | ${actual} | ${result} |" >> "$GITHUB_STEP_SUMMARY"
          done

          exit "$failed"

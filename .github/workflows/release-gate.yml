name: Release Gate

on:
  workflow_dispatch:
    inputs:
      run_fly_checks:
        description: "Run Fly preflight and health checks using repository secrets"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      run_smoke_test:
        description: "Run production smoke test"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  WEB_URL: https://www.infamousfreight.com
  BARE_SITE_URL: https://infamousfreight.com
  API_URL: https://infamous-freight-api.fly.dev
  FLY_APP_NAME: infamous-freight-api

jobs:
  release-gate:
    name: Validate release gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Prisma version alignment
        run: pnpm run check:prisma-versions

      - name: Generate Prisma client
        run: pnpm run prisma:generate

      - name: Validate Prisma schema
        run: pnpm run prisma:validate

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Setup flyctl
        if: ${{ inputs.run_fly_checks == 'true' }}
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master (2026-04-08)

      - name: Fly preflight
        if: ${{ inputs.run_fly_checks == 'true' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: pnpm run production:preflight

      - name: Fly health diagnosis
        if: ${{ inputs.run_fly_checks == 'true' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: pnpm run fly:health

      - name: Production smoke test
        if: ${{ inputs.run_smoke_test == 'true' }}
        run: pnpm run production:smoke-test

      - name: Write release gate summary
        if: always()
        run: |
          {
            echo "# Release Gate Summary"
            echo ""
            echo "- Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- SHA: ${{ github.sha }}"
            echo "- Web URL: ${WEB_URL}"
            echo "- Bare URL: ${BARE_SITE_URL}"
            echo "- API URL: ${API_URL}"
            echo "- Fly app: ${FLY_APP_NAME}"
            echo "- Fly checks requested: ${{ inputs.run_fly_checks }}"
            echo "- Smoke test requested: ${{ inputs.run_smoke_test }}"
            echo ""
            echo "Paste this workflow summary and any failed step output into docs/LAUNCH_EVIDENCE_LOG.md before approving paid beta."
          } >> "$GITHUB_STEP_SUMMARY"

[build]
  publish = "apps/web/dist"
  command = "pnpm run build:web"
  # Netlify Functions are intentionally kept out of the Git deploy bundle while
  # the site's function-scoped environment payload exceeds Netlify's 4 KB
  # per-function deploy limit. Public API traffic is proxied to the Fly backend
  # instead of a Netlify function so deploys do not fail during function upload.
  functions = "netlify/event-functions"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  SENTRY_DISABLE_UPLOAD = "true"
  # The app does not read FEATURE_FLAGS, and oversized values under this name
  # can exceed Netlify's per-function environment limit during deploy.
  FEATURE_FLAGS = ""

# netlify/edge-functions/seo-prerender.ts is intentionally disabled as
# seo-prerender.ts.disabled. Netlify attaches the site environment payload when
# creating Edge Functions, and this site currently exceeds Netlify's 4 KB Edge
# Function environment limit before any user code runs.

# Canonical domain redirects
[[redirects]]
  from = "https://infamousfreight.com/*"
  to = "https://www.infamousfreight.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://infamous-freight.netlify.app/*"
  to = "https://www.infamousfreight.com/:splat"
  status = 301
  force = true

# Platform subdomain redirects
[[redirects]]
  from = "https://app.infamousfreight.com/*"
  to = "https://www.infamousfreight.com/"
  status = 301
  force = true

[[redirects]]
  from = "https://admin.infamousfreight.com/*"
  to = "https://www.infamousfreight.com/"
  status = 301
  force = true

[[redirects]]
  from = "https://dispatch.infamousfreight.com/*"
  to = "https://www.infamousfreight.com/"
  status = 301
  force = true

[[redirects]]
  from = "https://driver.infamousfreight.com/*"
  to = "https://www.infamousfreight.com/"
  status = 301
  force = true

[[redirects]]
  from = "https://broker.infamousfreight.com/*"
  to = "https://www.infamousfreight.com/"
  status = 301
  force = true

[[redirects]]
  from = "https://carrier.infamousfreight.com/*"
  to = "https://www.infamousfreight.com/"
  status = 301
  force = true

# If api.infamousfreight.com is attached to this Netlify site, proxy it to the Fly API.
# If DNS points api.infamousfreight.com directly at Fly, this rule is not involved.
[[redirects]]
  from = "https://api.infamousfreight.com/api/*"
  to = "https://infamous-freight-api.fly.dev/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://api.infamousfreight.com/socket.io/*"
  to = "https://infamous-freight-api.fly.dev/socket.io/:splat"
  status = 200
  force = true

# Frontend-relative API and websocket traffic proxies to the production Fly API.

[[redirects]]
  from = "/api/health"
  to = "https://infamous-freight-api.fly.dev/api/health"
  status = 200
  force = true

[[redirects]]
  from = "/api/health/ready"
  to = "https://infamous-freight-api.fly.dev/api/health/ready"
  status = 200
  force = true

[[redirects]]
  from = "/api/load-requests"
  to = "https://infamous-freight-api.fly.dev/api/load-requests"
  status = 200
  force = true

[[redirects]]
  from = "/api/load-requests/*"
  to = "https://infamous-freight-api.fly.dev/api/load-requests/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/public/quote-requests"
  to = "https://infamous-freight-api.fly.dev/api/public/quote-requests"
  status = 200
  force = true

[[redirects]]
  from = "/api/public/shipments/:trackingNumber"
  to = "https://infamous-freight-api.fly.dev/api/public/shipments/:trackingNumber"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://infamous-freight-api.fly.dev/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/socket.io/*"
  to = "https://infamous-freight-api.fly.dev/socket.io/:splat"
  status = 200
  force = true

# Source maps should not be publicly served.
[[redirects]]
  from = "/*.map"
  to = "/404"
  status = 404
  force = true

# Public route aliases
[[redirects]]
  from = "/track-shipment"
  to = "/tracking"
  status = 301

[[redirects]]
  from = "/drive"
  to = "/drivers"
  status = 301

# SPA fallback. This must stay after API, websocket, and static-file rules.
# Do not add forced /assets/* redirects above this rule; doing so can block
# real Vite JS/CSS bundles and leave production stuck on the static shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://www.google-analytics.com https://stats.g.doubleclick.net; connect-src 'self' https://api.infamousfreight.com https://api.stripe.com https://*.sentry.io https://*.ingest.sentry.io https://ingesteer.services-prod.nsvcs.net https://www.google-analytics.com https://www.googletagmanager.com; frame-src https://js.stripe.com https://hooks.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; worker-src 'self'; upgrade-insecure-requests"
    Cross-Origin-Embedder-Policy = "credentialless"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Resource-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self https://js.stripe.com), usb=(), bluetooth=(), serial=(), hid=(), accelerometer=(), gyroscope=(), magnetometer=(), ambient-light-sensor=(), autoplay=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(self), idle-detection=(), interest-cohort=(), picture-in-picture=(self), screen-wake-lock=(), xr-spatial-tracking=()"
    X-Powered-By = ""
    X-DNS-Prefetch-Control = "off"
    X-Permitted-Cross-Domain-Policies = "none"


[[headers]]
  for = "/driver-pwa/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; font-src 'self' data:; img-src 'self' data:; connect-src 'self' https://api.infamousfreight.com https://*.sentry.io https://*.ingest.sentry.io; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; worker-src 'self'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Embedder-Policy = "credentialless"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), serial=(), hid=(), accelerometer=(), gyroscope=(), magnetometer=(), ambient-light-sensor=(), autoplay=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(self), idle-detection=(), interest-cohort=(), picture-in-picture=(), screen-wake-lock=(), xr-spatial-tracking=()"
    X-Powered-By = ""
    X-DNS-Prefetch-Control = "off"
    X-Permitted-Cross-Domain-Policies = "none"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=300, stale-while-revalidate=86400"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"
